<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff6fa">
<meta name="description" content="一个可爱的互动小网页 💗">
<title>✨ Guess Who's the Prettiest? 💗</title>
<style>
:root{
  --pink:#ff6fae; --pink2:#ff9ac5; --ink:#5c4050; --muted:#8f7180;
  --glass:rgba(255,255,255,.72); --line:rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{
  min-height:100vh; min-height:100dvh; color:var(--ink);
  background:
    radial-gradient(circle at 12% 12%,#fff 0 5%,transparent 22%),
    radial-gradient(circle at 88% 22%,#ffdceb 0 4%,transparent 23%),
    linear-gradient(135deg,#fff1f7 0%,#eef8ff 48%,#fff8df 100%);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0
}
body:before{width:260px;height:260px;background:#ffc9df55;top:-100px;right:-80px}
body:after{width:220px;height:220px;background:#cceeff66;bottom:-100px;left:-70px}

.app{
  position:relative;z-index:1;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}
header{
  width:min(1100px,92vw);margin:0 auto;padding:22px 0;
  display:flex;align-items:center;justify-content:space-between;gap:15px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px}
.logo{
  width:42px;height:42px;display:grid;place-items:center;border-radius:14px;
  background:#fff;box-shadow:0 8px 25px #b8668b22;font-size:23px
}
.tag{
  padding:8px 12px;border-radius:999px;background:#ffffff80;
  border:1px solid #fff;font-size:12px;color:var(--muted);font-weight:700
}
main{
  flex:1;width:min(1100px,92vw);margin:auto;display:grid;place-items:center;
  padding:15px 0 40px;
}
.page{display:none;width:100%;animation:enter .65s cubic-bezier(.2,.9,.25,1.15)}
.page.active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.card{
  width:min(680px,100%);margin:auto;padding:clamp(28px,6vw,55px) clamp(20px,5vw,52px);
  border:1px solid var(--line);border-radius:34px;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 25px 80px #a85f7d20;text-align:center;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  background:#fff9;border:1px solid #fff;color:#b06a88;font-size:12px;font-weight:800;
  letter-spacing:.8px;text-transform:uppercase
}
.hero{font-size:clamp(58px,16vw,92px);margin:18px 0 8px;line-height:1}
h1{
  margin:0;color:#563c4b;font-size:clamp(30px,7vw,54px);line-height:1.18;
  letter-spacing:-1px
}
.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:440px;margin:17px auto 27px}
.form{display:flex;flex-direction:column;align-items:center;gap:12px}
input{
  width:min(500px,100%);height:58px;padding:0 19px;border-radius:18px;border:2px solid #ffd0e2;
  outline:none;background:#fff;color:var(--ink);font-size:18px;text-align:center;
  box-shadow:0 7px 25px #c06b8a12;transition:.2s
}
input:focus{border-color:var(--pink);box-shadow:0 0 0 5px #ffddea}
button{
  width:min(500px,100%);height:56px;border:0;border-radius:18px;cursor:pointer;
  color:#fff;font-size:17px;font-weight:900;
  background:linear-gradient(135deg,var(--pink),#ff997f);
  box-shadow:0 12px 25px #ff76ac3b;transition:.2s
}
button:hover{transform:translateY(-2px);box-shadow:0 16px 30px #ff76ac48}
button:active{transform:scale(.98)}
.hint{margin-top:16px;font-size:13px;color:#a78695}
.footer{text-align:center;padding:15px 20px 25px;color:#aa8d9b;font-size:12px}
.successEmoji{font-size:clamp(70px,19vw,105px);line-height:1;animation:celebrate 1.2s ease}
@keyframes celebrate{0%{transform:scale(.2) rotate(-25deg);opacity:0}65%{transform:scale(1.12) rotate(7deg)}100%{transform:none}}
.success h1{color:#ff5b9d}
.name{
  display:inline-block;margin:19px 0 3px;padding:11px 24px;border-radius:999px;
  color:#ff579b;background:#fff;border:1px solid #ffe1ec;font-size:clamp(22px,6vw,30px);
  font-weight:950;box-shadow:0 10px 25px #ff91bb22
}
.award{
  margin:20px auto 10px;width:min(440px,100%);padding:16px;border-radius:20px;
  background:#fff8;border:1px solid #fff;color:#725364;line-height:1.75
}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions button{width:auto;min-width:170px;padding:0 22px}
.secondary{background:#fff;color:#c55c87;border:1px solid #ffd1e1;box-shadow:none}
.particle{
 position:fixed;top:-50px;z-index:50;pointer-events:none;animation:fall 2.8s ease-in forwards
}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}
.heart{
 position:fixed;z-index:60;pointer-events:none;font-size:24px;
 animation:heart .9s ease-out forwards
}
@keyframes heart{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.modal{
 position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:100;
 background:#4e294044;backdrop-filter:blur(5px)
}
.modal.show{display:grid}
.modalbox{
 width:min(420px,100%);padding:30px 22px 25px;border-radius:30px;text-align:center;
 background:#fff;box-shadow:0 30px 90px #40203335;animation:modal .38s cubic-bezier(.2,1.35,.35,1)
}
@keyframes modal{from{opacity:0;transform:scale(.7) translateY(15px)}to{opacity:1;transform:none}}
.modalEmoji{font-size:62px}
.modal h2{font-size:28px;margin:10px 0;color:#603e50}
.modal p{font-size:16px;line-height:1.8;color:#8b6d7c;margin:0 0 5px}
.toast{
 position:fixed;top:18px;left:50%;z-index:110;transform:translate(-50%,-130px);
 padding:13px 19px;border-radius:999px;background:#fff;color:#ff579c;font-weight:900;
 box-shadow:0 12px 35px #a95b7c25;transition:.45s;white-space:nowrap
}
.toast.show{transform:translate(-50%,0)}
.float{position:fixed;bottom:-50px;font-size:25px;opacity:.7;pointer-events:none;z-index:0;animation:float 7s linear infinite}
@keyframes float{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@media(max-width:600px){
 header{padding:14px 0}
 .brand span{font-size:14px}
 .tag{display:none}
 main{padding:8px 0 22px}
 .card{border-radius:28px;padding:30px 18px}
 .lead{font-size:15px;margin-bottom:22px}
 input{height:55px;font-size:17px}
 button{height:53px;font-size:16px}
 .footer{padding-bottom:18px}
}
@media(max-height:700px){
 .card{padding-top:24px;padding-bottom:24px}
 .hero{font-size:55px;margin-top:10px}
 .lead{margin:10px auto 16px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">💗</div><span>LITTLE LOVE QUIZ</span></div>
  <div class="tag">A tiny question, a very important answer ✨</div>
</header>

<div class="float" style="left:7%;animation-delay:0s">🌸</div>
<div class="float" style="left:22%;animation-delay:2.1s">💗</div>
<div class="float" style="left:40%;animation-delay:4.2s">✨</div>
<div class="float" style="left:62%;animation-delay:1.3s">🎀</div>
<div class="float" style="left:82%;animation-delay:3.4s">🦄</div>

<main>
<section id="home" class="page active">
 <div class="card">
  <div class="eyebrow">💌 Question No. 01</div>
  <div class="hero">🥰✨</div>
  <h1>谁是世界上漂亮的人？</h1>
  <p class="lead">这是一个非常严肃的问题。<br>请认真输入你心中的答案吧～ 💕</p>
  <div class="form">
   <input id="answer" type="text" placeholder="输入答案..." autocomplete="off" enterkeyhint="done">
   <button id="submit">确认答案&nbsp; 💖</button>
  </div>
  <div class="hint">提示：她的名字，也可以缩写成三个字母 🤫</div>
 </div>
</section>

<section id="success" class="page">
 <div class="card">
  <div class="eyebrow">🏆 Answer Verified</div>
  <div class="successEmoji">🎉👑💖</div>
  <h1>回答正确！</h1>
  <div class="name">申子娴 · SZX ✨</div>
  <div class="award">
   🌎 <b>恭喜你！</b><br>
   你成功找到了全世界最漂亮的人。<br>
   <span>🌸 💐 🎀 👸 💎 🦄 💞</span>
  </div>
  <div class="actions">
   <button id="again">再答一次&nbsp; 🔄</button>
  </div>
 </div>
</section>
</main>

<div class="footer">Made with 💗</div>
</div>

<div id="wrong" class="modal">
 <div class="modalbox">
  <div class="modalEmoji">😵‍💫❌</div>
  <h2>答案错误啦</h2>
  <p>这个答案不对哦～<br>再认真想一想是谁吧 👀💭</p>
  <button id="retry">重新回答 💕</button>
 </div>
</div>

<div id="toast" class="toast">🎉 回答正确！你太懂了！💖</div>

<script>
const $=id=>document.getElementById(id);
const input=$("answer");

function show(page){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 $(page).classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}
function check(){
 const value=input.value.trim().toLowerCase();
 if(value==="szx" || value==="申子娴"){
   show("success");
   celebration();
   $("toast").classList.add("show");
   setTimeout(()=>$("toast").classList.remove("show"),2600);
 }else{
   $("wrong").classList.add("show");
 }
}
function celebration(){
 const emojis=["🎉","💖","✨","🥳","🌸","💗","🎀","⭐","💐","🦄","💕","👑","🍓","🌈"];
 for(let i=0;i<70;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  p.style.left=Math.random()*100+"vw";
  p.style.animationDelay=Math.random()*1.1+"s";
  p.style.fontSize=(20+Math.random()*23)+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),4000);
 }
}
$("submit").onclick=check;
input.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("retry").onclick=()=>{
 $("wrong").classList.remove("show");
 input.value="";
 show("home");
 setTimeout(()=>input.focus(),250);
};
$("again").onclick=()=>{
 show("home");
 input.value="";
 setTimeout(()=>input.focus(),250);
};
$("wrong").addEventListener("click",e=>{
 if(e.target===$("wrong")) $("wrong").classList.remove("show");
});
document.addEventListener("click",e=>{
 if(e.target.closest("button,input")) return;
 for(let i=0;i<4;i++){
  const h=document.createElement("div");
  h.className="heart";h.textContent=["💗","💕","💖","💘","✨"][Math.floor(Math.random()*5)];
  h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";
  h.style.setProperty("--x",(Math.random()*140-70)+"px");
  h.style.setProperty("--y",(Math.random()*-130-30)+"px");
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),950);
 }
});
</script>
</body>
</html>
